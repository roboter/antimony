name: Mac Build

on:
  push:
    branches: [ "master", "main", "feature/*" ]
    tags:
      - '*'
  pull_request:
    branches: [ "master", "main", "feature/*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew update || true
        brew install libpng boost-python3 qt@5 lemon flex ninja cmake dylibbundler

    - name: Build Antimony
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_PREFIX_PATH=$(brew --prefix qt@5) -GNinja ..
        ninja

    - name: Bundle macOS App Dependencies
      run: |
        chmod +x scripts/bundle-mac.sh
        ./scripts/bundle-mac.sh build/app/Antimony.app

    - name: Create DMG
      run: |
        mkdir -p dmg_root
        cp -R build/app/Antimony.app dmg_root/
        ln -s /Applications dmg_root/Applications
        hdiutil create -volname "Antimony" -srcfolder dmg_root -ov -format UDZO antimony-mac.dmg
        rm -rf dmg_root

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: antimony-mac-build
        path: antimony-mac.dmg

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: antimony-mac.dmg
