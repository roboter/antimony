name: Windows Build

on:
  push:
    branches: [ "master", "main", "feature/win32-build" ]
  pull_request:
    branches: [ "master", "main", "feature/win32-build" ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-qt5
          mingw-w64-ucrt-x86_64-python
          mingw-w64-ucrt-x86_64-boost
          mingw-w64-ucrt-x86_64-libpng

    - name: Build Antimony
      shell: msys2 {0}
      run: |
        mkdir -p build
        cd build
        qmake-qt5 ../qt/antimony.pro
        mingw32-make -j$(nproc)
        
        # Copy python modules
        mkdir -p release/sb
        cp -f -R ../py/nodes release/sb/
        cp -f -R ../py/fab release/sb/

    - name: Build and Run Tests
      shell: msys2 {0}
      run: |
        mkdir -p build-tests
        cd build-tests
        qmake-qt5 ../qt/antimony-tests.pro
        mingw32-make -j$(nproc)
        
        # Run the compiled tests
        if [ -f "release/antimony-tests.exe" ]; then
          ./release/antimony-tests.exe
        else
          ./antimony-tests.exe
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: antimony-windows-build
        path: build/release/
